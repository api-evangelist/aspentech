naftiko: 1.0.0-alpha2
info:
  label: AspenTech Inmation Web API — Data
  description: 'AspenTech Inmation Web API — Data. 3 operations. Lead operation: Execute RPC call. Self-contained Naftiko
    capability covering one Aspentech business surface.'
  tags:
  - Aspentech
  - Data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASPENTECH_API_KEY: ASPENTECH_API_KEY
capability:
  consumes:
  - type: http
    namespace: inmation-web-data
    baseUri: http://{hostname}:8002
    description: AspenTech Inmation Web API — Data business capability. Self-contained, no shared references.
    resources:
    - name: api
      path: /api
      operations:
      - name: executerpccall
        method: POST
        description: Execute RPC call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-data-read
      path: /api/data/read
      operations:
      - name: readdataitems
        method: POST
        description: Read current process data values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-data-write
      path: /api/data/write
      operations:
      - name: writedataitems
        method: POST
        description: Write process data values
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ASPENTECH_API_KEY}}'
  exposes:
  - type: rest
    namespace: inmation-web-data-rest
    port: 8080
    description: REST adapter for AspenTech Inmation Web API — Data. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api
      name: api
      description: REST surface for api.
      operations:
      - method: POST
        name: executerpccall
        description: Execute RPC call
        call: inmation-web-data.executerpccall
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/data/read
      name: api-data-read
      description: REST surface for api-data-read.
      operations:
      - method: POST
        name: readdataitems
        description: Read current process data values
        call: inmation-web-data.readdataitems
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/data/write
      name: api-data-write
      description: REST surface for api-data-write.
      operations:
      - method: POST
        name: writedataitems
        description: Write process data values
        call: inmation-web-data.writedataitems
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inmation-web-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for AspenTech Inmation Web API — Data. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: execute-rpc-call
      description: Execute RPC call
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inmation-web-data.executerpccall
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: read-current-process-data-values
      description: Read current process data values
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inmation-web-data.readdataitems
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: write-process-data-values
      description: Write process data values
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: inmation-web-data.writedataitems
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
