naftiko: 1.0.0-alpha2
info:
  label: AspenTech Inmation Web API — System
  description: 'AspenTech Inmation Web API — System. 1 operations. Lead operation: Get system information. Self-contained
    Naftiko capability covering one Aspentech business surface.'
  tags:
  - Aspentech
  - System
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ASPENTECH_API_KEY: ASPENTECH_API_KEY
capability:
  consumes:
  - type: http
    namespace: inmation-web-system
    baseUri: http://{hostname}:8002
    description: AspenTech Inmation Web API — System business capability. Self-contained, no shared references.
    resources:
    - name: api-sys-info
      path: /api/sys/info
      operations:
      - name: getsysteminfo
        method: GET
        description: Get system information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ASPENTECH_API_KEY}}'
  exposes:
  - type: rest
    namespace: inmation-web-system-rest
    port: 8080
    description: REST adapter for AspenTech Inmation Web API — System. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/sys/info
      name: api-sys-info
      description: REST surface for api-sys-info.
      operations:
      - method: GET
        name: getsysteminfo
        description: Get system information
        call: inmation-web-system.getsysteminfo
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: inmation-web-system-mcp
    port: 9090
    transport: http
    description: MCP adapter for AspenTech Inmation Web API — System. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-system-information
      description: Get system information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: inmation-web-system.getsysteminfo
      outputParameters:
      - type: object
        mapping: $.
