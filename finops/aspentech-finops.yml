meters:
  - name: platform_license
    description: Annual aspenONE / AIoT Hub / Inmation enterprise license fee
    unit: year
    aggregation: max
    dimensions:
      - product
      - site
  - name: tag_count
    description: Inmation tag / process variable count licensed
    unit: tag
    aggregation: max
    dimensions:
      - site
  - name: concurrent_users
    description: Concurrent named-user or floating-user license entitlement
    unit: seat
    aggregation: max
    dimensions:
      - product
      - site
  - name: api_calls
    description: Activity-only meter; API access is included in the platform license
    unit: request
    aggregation: sum
    dimensions:
      - product
      - site
principles:
  - name: Visibility
    description: Use Inmation server admin dashboards and the AspenTech license-management portal to
      surface tag-count consumption and concurrent-user peaks against entitlement.
  - name: Allocation
    description: Allocate license cost by site / refinery / plant using AspenTech's site-keyed entitlements
      and Inmation namespaces; tag spend by business unit in the consumer's CMDB.
  - name: Optimization
    description: Right-size tag-count entitlements annually; consolidate Inmation servers where possible;
      retire unused aspenONE seats at renewal.
  - name: Accountability
    description: Plant IT / process-control engineers own AspenTech spend; renewal cycles are typically
      annual with site-by-site review.
