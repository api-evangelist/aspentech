description: AspenTech (Aspen Technology, Inc.) sells enterprise industrial software (aspenONE process
  optimization suite, AIoT Hub, Inmation industrial data platform). Pricing is quote-based via direct
  sales and partners; AspenTech does not publish per-API or per-seat list pricing on its website.
sources:
  - https://www.aspentech.com/en/products
notes: No public price list. Inmation and aspenONE are sold under enterprise licenses; APIs (Web API,
  Simple Call Interface) are bundled with the platform license, not metered separately.
plans:
  - id: aspentech-enterprise
    name: Enterprise License
    type: enterprise
    description: AspenTech is sold as enterprise software with bundled APIs. Pricing depends on the
      product (aspenONE, Inmation, AIoT Hub), site count, server capacity, and tag/process counts.
    entries:
      - label: Platform License
        name: platform_license
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: custom (contact AspenTech sales)
        userMultiplied: false
      - label: API Access (Inmation Web API / SCI)
        name: api_access
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: included with platform license
        userMultiplied: false
    elements:
      - name: aspenONE Engineering Suite
      - name: aspenONE APM
      - name: AIoT Hub
      - name: Inmation Web API
      - name: Inmation Simple Call Interface (SCI)
