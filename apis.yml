name: AspenTech
description: >-
  AspenTech (Aspen Technology, Inc.) is a global leader in industrial software for asset optimization across the energy,
  chemicals, and manufacturing industries. AspenTech provides process simulation, optimization, and industrial IoT
  platforms including the aspenONE suite and Inmation industrial data platform. The Inmation platform provides Web API
  and Simple Call Interface (SCI) APIs for external applications to interact with industrial IoT and time-series process
  data via HTTP and WebSocket interfaces. AspenTech serves refineries, petrochemical plants, power generation
  facilities, and other industrial operations worldwide.
