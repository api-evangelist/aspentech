  - type: Features
    data:
      - name: Inmation Industrial IoT Platform
        description: >-
          The Inmation platform provides industrial-grade time-series data management, process data connectivity, and
          real-time analytics for manufacturing and energy operations.
      - name: Process Simulation
        description: >-
          aspenONE suite provides high-fidelity process simulation for design, optimization, and operational decision
          support in chemical plants, refineries, and energy facilities.
      - name: WebSocket Real-Time Data
        description: >-
          WebSocket interface in the Inmation Web API enables real-time streaming of process data, alarm states, and
          operational events to external applications.
      - name: Asset Performance Management
        description: >-
          Tools for monitoring asset health, predicting maintenance needs, and optimizing equipment performance across
          industrial operations.
      - name: AI/ML Integration
        description: >-
          APIs for integrating AI and machine learning models with process data to enable predictive analytics and
          autonomous optimization.
  - type: UseCases
    data:
      - name: Process Data Integration
        description: >-
          Operations technology teams integrate the Inmation Web API with business intelligence tools, historian
          systems, and enterprise applications to access real-time and historical process data.
      - name: Digital Twin Development
        description: >-
          Engineering teams use aspenONE simulation APIs to build digital twins of process plants for operations
          optimization and scenario analysis.
      - name: Alarm Management
        description: >-
          Control systems engineers use the Inmation API to build custom alarm management dashboards and analytics for
          industrial operations.
      - name: Energy Optimization
        description: >-
          Refineries and petrochemical plants use AspenTech APIs to connect optimization models with real-time
          operations for energy efficiency.
  - type: Integrations
    data:
      - name: OSIsoft PI System
        description: >-
          AspenTech integrates with OSIsoft PI (now AVEVA PI) for process data historian connectivity and operational
          data access.
      - name: SAP
        description: Enterprise integration with SAP ERP systems for maintenance, production, and procurement data exchange.
      - name: AVEVA
        description: Integration with AVEVA engineering and operations management platforms for plant lifecycle data management.
  - type: Integrations
    url: https://www.aspentech.com/en/partners
